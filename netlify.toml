[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# SPA: 모든 경로를 index.html로 (새로고침·직접 접속 시 404 방지)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 서비스 워커는 항상 최신본을 받도록 캐시하지 않음
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
