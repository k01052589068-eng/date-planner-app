[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Firebase 로그인 핸들러를 앱과 같은 도메인에서 제공 (리디렉션 로그인이 서드파티 저장소 차단에 막히지 않도록)
# SPA 규칙보다 먼저 와야 한다.
[[redirects]]
  from = "/__/auth/*"
  to = "https://date-planner-78162.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# SPA: 모든 경로를 index.html로 (새로고침·직접 접속 시 404 방지)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 서비스 워커는 항상 최신본을 받도록 캐시하지 않음
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
